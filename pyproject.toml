[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-neuro"
version = "0.1.0"
description = "Aegis-Neuro: a deterministic, local-only multi-agent adversarial simulator for multi-modal biometric systems (fingerprint, retina, EEG, ECG, voice)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Aegis Cyber-Physical Security", email = "security@example.com" }
]
keywords = [
    "biometrics",
    "adversarial",
    "multi-agent",
    "eeg",
    "ecg",
    "fingerprint",
    "retina",
    "voice",
    "security",
    "simulation",
    "red-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "mypy>=1.8",
    "ruff>=0.5.0",
]

[project.scripts]
aegis-neuro = "aegis_neuro.cli:main"

[project.urls]
Homepage = "https://github.com/AAH20/Aegis-Neuro-Biometric-Simulator"
Issues = "https://github.com/AAH20/Aegis-Neuro-Biometric-Simulator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis_neuro = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
